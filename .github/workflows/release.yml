name: Release

# Registered as the npm Trusted Publisher workflow: keep this file name.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm >= 11.5. No NPM_TOKEN is used anywhere.
      - run: npm install -g npm@latest && npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - id: changesets
        uses: changesets/action@v1
        with:
          # No pending changesets (e.g. a locally versioned commit was merged): publish.
          publish: pnpm changeset publish
          version: pnpm version-packages
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
      - name: Explain Version PR permission failure
        if: failure() && steps.changesets.outcome == 'failure'
        run: |
          echo "::error::Release failed. If the log above says GitHub Actions is not permitted to create or approve pull requests, nothing was published."
          echo "::error::Enable Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests' (org and repo), or version locally with 'pnpm changeset version' and push. See CONTRIBUTING.md#releasing."
