name: Release

# Registered as the npm Trusted Publisher workflow: keep this file name.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: github.repository == 'ptmafia/uncage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm >= 11.5. No NPM_TOKEN is used anywhere.
      - run: npm install -g npm@latest && npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          # No pending changesets (e.g. a locally versioned commit was merged): publish.
          publish: pnpm changeset publish
          version: pnpm version-packages
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # npm only accepts provenance from public repositories (E422 "Unsupported GitHub Actions
          # source repository visibility: private"). Trusted publishing (OIDC) itself works either
          # way, so attach provenance only while the repo is public.
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.private && 'false' || 'true' }}
      - name: Explain Version PR permission failure
        if: failure() && steps.changesets.outcome == 'failure'
        run: |
          echo "::error::The release step failed. If the failure was creating the Version PR (missing permission), nothing was published: see CONTRIBUTING.md#releasing. Otherwise check the publish log above."
