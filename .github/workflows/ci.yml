name: CI

on:
  pull_request:
  push:
    branches: [main, 'feat/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Install Playwright Chromium
        run: pnpm --dir e2e exec playwright install --with-deps chromium
      - name: E2E (mock daemon)
        run: pnpm e2e:mock
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-node${{ matrix.node }}
          path: e2e/test-results
          if-no-files-found: ignore

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The API reference and the sample check read the built packages.
      - run: pnpm exec turbo run build --filter='docs^...'
      - name: Type-check every code sample on the site
        run: pnpm --filter docs check:snippets
      - name: Build the site (generates the API reference, validates every internal link)
        run: pnpm --filter docs build
